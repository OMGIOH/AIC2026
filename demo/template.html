<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>《安王与祖王》人物知识图谱 · 初步 Demo</title>
<style>
  :root{
    --bg:#f5f1e8; --panel:#fffdf8; --panel2:#faf6ec; --ink:#292524; --ink2:#57534e;
    --line:#e2d9c6; --accent:#b91c1c; --fact:#52525b; --version:#2563eb; --cross:#9333ea;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:"PingFang SC","Hiragino Sans GB","Songti SC","Microsoft YaHei",sans-serif;
       background:var(--bg); color:var(--ink); display:flex; flex-direction:column; overflow:hidden;}
  header{background:#322d29; color:#f5f1e8; padding:10px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  header h1{font-size:17px; font-weight:600; letter-spacing:.5px;}
  .badge-demo{background:var(--accent); color:#fff; font-size:11px; padding:2px 8px; border-radius:10px; white-space:nowrap;}
  .stats{display:flex; gap:8px; flex-wrap:wrap;}
  .stats span{background:#4a423c; border-radius:4px; padding:3px 9px; font-size:12px; color:#e8e0d0;}
  #search{margin-left:auto; background:#4a423c; border:1px solid #6b5f55; color:#f5f1e8; border-radius:6px;
          padding:5px 10px; font-size:13px; width:230px; outline:none;}
  #search::placeholder{color:#b3a794;}
  #app{flex:1; display:flex; min-height:0;}
  aside#left{width:212px; background:var(--panel); border-right:1px solid var(--line); padding:12px; overflow-y:auto; flex-shrink:0;}
  aside#detail{width:330px; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; flex-shrink:0;}
  #app.entity-open aside#detail{display:none;}
  .entity-anim{animation:epIn .3s ease;}
  @keyframes epIn{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
  #view-entity{overflow-y:auto; padding:26px 40px; background:var(--bg);}
  .ep-wrap{max-width:940px; margin:0 auto;}
  .ep-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .back-btn{border:1px solid var(--line); background:var(--panel2); border-radius:6px; padding:5px 14px;
            font-size:13px; color:var(--ink2); cursor:pointer;}
  .back-btn:hover{border-color:#b49f78; color:var(--ink);}
  .ep-badge{font-size:11px; color:#f5f1e8; background:#322d29; border-radius:9px; padding:3px 11px; white-space:nowrap;}
  .ep-name{font-size:26px; font-weight:700; margin:14px 0 8px;}
  .ep-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 34px; align-items:start; margin-top:6px;}
  .ep-col{min-width:0;}
  .media-row{display:flex; gap:12px; margin:6px 0 10px;}
  .media-slot{flex:1; aspect-ratio:16/9; border:1.5px dashed #cbbc9c; border-radius:10px; background:var(--panel2);
              display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:#a39a88;}
  .media-slot .m-ico{width:34px; height:34px; border-radius:50%; background:#e7dfcc; color:#8a8070;
                     display:flex; align-items:center; justify-content:center;}
  .media-slot b{font-size:13px; font-weight:600;}
  .media-slot span{font-size:11px;}
  main#main{flex:1; position:relative; min-width:0;}
  .tabs{display:flex; gap:4px; margin-bottom:14px;}
  .tab{flex:1; padding:7px 0; border:1px solid var(--line); background:var(--panel2); cursor:pointer;
       border-radius:6px; font-size:13px; color:var(--ink2);}
  .tab.active{background:#322d29; color:#f5f1e8; border-color:#322d29;}
  #legend h3{font-size:12px; color:var(--ink2); margin:12px 0 6px; font-weight:600;}
  .lg-row{display:flex; align-items:center; gap:6px; font-size:12px; padding:2px 0; cursor:pointer; color:var(--ink);}
  .lg-row.off{opacity:.35;}
  .lg-dot{width:11px; height:11px; border-radius:50%; flex-shrink:0;}
  .lg-line{width:18px; height:0; border-top:3px solid; flex-shrink:0;}
  .lg-count{margin-left:auto; color:var(--ink2); font-size:11px;}
  #view-help{margin-top:14px; font-size:11px; color:#8a8070; line-height:1.7; border-top:1px dashed var(--line); padding-top:10px;}
  #btn-reset{margin-top:10px; width:100%; padding:6px; border:1px solid var(--line); background:var(--panel2);
             border-radius:6px; cursor:pointer; font-size:12px; color:var(--ink2);}
  .view{position:absolute; inset:0;}
  .view.hidden{display:none;}
  svg{display:block; width:100%; height:100%; cursor:grab;}
  svg.panning{cursor:grabbing;}
  .edge{stroke-linecap:round;}
  .edge-label{font-size:9.5px; fill:var(--ink2); paint-order:stroke; stroke:#f5f1e8; stroke-width:3px;
              pointer-events:none; user-select:none;}
  .edge-hit{stroke:transparent; stroke-width:12; cursor:pointer;}
  .node{cursor:pointer;}
  .node text{font-size:11.5px; fill:var(--ink); text-anchor:middle; pointer-events:none; user-select:none;
             paint-order:stroke; stroke:#f5f1e8; stroke-width:3px;}
  .node.ext circle{stroke-dasharray:4 3;}
  .node.selected circle{stroke:#b91c1c; stroke-width:3px;}
  .node.dimmed{opacity:.16;}
  .node.matched circle{stroke:#b91c1c; stroke-width:2.5px; stroke-dasharray:none;}
  .edge.dimmed{opacity:.12;}
  .edge-label.dimmed{opacity:.12;}
  /* 时间线 */
  #view-timeline{overflow-y:auto; padding:22px 30px; background:var(--bg);}
  .tl-rail{position:relative; max-width:880px; margin:0 auto; padding-left:56px;}
  .tl-rail::before{content:""; position:absolute; left:19px; top:8px; bottom:8px; width:2px; background:#d8cdb4;}
  .beat{position:relative; margin-bottom:14px;}
  .beat-no{position:absolute; left:-56px; top:2px; width:38px; height:38px; border-radius:50%;
           background:#322d29; color:#f5f1e8; display:flex; align-items:center; justify-content:center;
           font-size:13px; font-weight:600;}
  .beat-card{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 16px; cursor:pointer;}
  .beat-card:hover{border-color:#b49f78;}
  .beat-card.selected{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .beat-title{font-size:14px; font-weight:600; margin-bottom:4px;}
  .beat-pages{font-size:11.5px; color:var(--ink2); margin-bottom:7px;}
  .chips{display:flex; flex-wrap:wrap; gap:5px;}
  .chip{font-size:11px; padding:2px 8px; border-radius:10px; background:var(--panel2); border:1px solid var(--line); cursor:pointer;}
  .chip:hover{border-color:#b49f78;}
  .chip .cdot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:0;}
  .chip-sub{font-size:11px; color:var(--ink2); margin-right:2px;}
  .ev-count{font-size:11px; color:#8a8070;}
  .sub-beats{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
  .sub-card{background:var(--panel2); border:1px dashed #cbbc9c; border-radius:6px; padding:8px 12px; cursor:pointer;}
  .sub-card:hover{border-color:#b49f78;}
  .sub-card.selected{border-color:var(--accent);}
  .sub-title{font-size:12.5px; font-weight:600; margin-bottom:3px;}
  .sub-pair{font-size:11.5px; color:var(--ink2); line-height:1.6;}
  /* 实体表 */
  #view-entities{overflow-y:auto; padding:22px 30px; background:var(--bg);}
  .ent-wrap{max-width:980px; margin:0 auto;}
  .ent-group{margin-bottom:18px;}
  .ent-group h3{font-size:13px; margin-bottom:6px; color:var(--ink); display:flex; align-items:center; gap:7px;}
  .ent-group h3 .lg-dot{width:10px; height:10px;}
  table{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  th{font-size:11px; text-align:left; color:var(--ink2); background:var(--panel2); padding:6px 12px; font-weight:600;}
  td{font-size:12.5px; padding:6px 12px; border-top:1px solid #efe8d8; cursor:pointer;}
  tr:hover td{background:#fdf9ee;}
  tr.selected td{background:#fbf1e2;}
  td.dim-name{color:#9a9080;}
  .tag{font-size:10px; padding:1px 6px; border-radius:8px; background:#eef4e8; color:#4d7c0f; margin-left:6px; white-space:nowrap;}
  .tag.off{background:#f1ece0; color:#a39a88;}
  .tag.ext{background:#f3f0ea; color:#8a8070;}
  /* 详情面板 */
  #detail-content{padding:16px;}
  .d-empty{color:#9a9080; font-size:12.5px; text-align:center; margin-top:40px; line-height:1.8;}
  .d-title{font-size:16px; font-weight:700; margin-bottom:6px;}
  .d-badges{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px;}
  .d-badge{font-size:10.5px; padding:2px 8px; border-radius:9px; background:var(--panel2); border:1px solid var(--line); color:var(--ink2);}
  .d-sec{font-size:11.5px; font-weight:700; color:var(--ink2); margin:13px 0 5px; text-transform:letter-spacing;}
  .d-text{font-size:12.5px; line-height:1.75; color:var(--ink);}
  .d-note{font-size:11.5px; color:var(--ink2); background:var(--panel2); border-left:3px solid #cbbc9c; padding:7px 10px; border-radius:0 5px 5px 0; line-height:1.65; margin-top:4px;}
  .quote{font-size:12px; line-height:1.65; padding:6px 9px; background:var(--panel2); border-radius:5px; margin-bottom:5px;}
  .quote .qp{color:#8a6d3b; font-size:10.5px; font-family:ui-monospace,Menlo,monospace;}
  .quote .qt{color:var(--ink);}
  .link-list{display:flex; flex-direction:column; gap:3px;}
  .lk{font-size:12px; color:#1d4ed8; cursor:pointer; line-height:1.6; word-break:break-all;}
  .lk:hover{text-decoration:underline;}
  .lk .rel{color:var(--ink2); font-size:11px;}
  .kv{font-size:12px; line-height:1.7;}
  .kv b{color:var(--ink2); font-weight:600;}
  .arrow-relation{display:flex; align-items:center; gap:8px; margin:8px 0; font-size:14px;}
  .arrow-relation .end{font-weight:700;}
  .arrow-relation .rel-badge{background:#322d29; color:#f5f1e8; padding:3px 12px; border-radius:5px; font-size:13px;}
  footer{background:#322d29; color:#b3a794; font-size:11px; padding:6px 18px; line-height:1.5;}
</style>
</head>
<body>
<header>
  <h1>《安王与祖王》人物知识图谱</h1>
  <span class="badge-demo">初步 DEMO · S0–S2 数据预览</span>
  <div class="stats" id="stats"></div>
  <input id="search" placeholder="搜索实体：安王 / 祖王 / 鱼女 …" autocomplete="off">
</header>
<div id="app">
  <aside id="left">
    <nav class="tabs">
      <button class="tab active" data-view="graph">图谱</button>
      <button class="tab" data-view="timeline">事件</button>
      <button class="tab" data-view="entities">实体</button>
      <button class="tab" data-view="entity" id="tab-entity" style="display:none">实体页</button>
    </nav>
    <div id="legend">
      <h3>节点类型（点击显隐）</h3>
      <div id="type-legend"></div>
      <h3>边层级（点击显隐）</h3>
      <div id="layer-legend"></div>
      <h3>显示选项</h3>
      <div class="lg-row" id="toggle-edge-labels"><span class="lg-line" style="border-top-style:dotted;border-color:#8a8070;"></span>边关系标签<span class="lg-count" id="edge-label-state">开</span></div>
    </div>
    <button id="btn-reset">重置视图与筛选</button>
    <div id="view-help">
      图谱：拖拽节点 / 滚轮缩放 / 空白处拖动平移；点击人物小球直接切换到实体页，其他节点或边点击后右侧看证据。<br>
      事件：十四节拍主线，斗法三对为 b07 子事件。<br>
      实体：S1 白名单全 39 项 + 外部版本件占位。
    </div>
  </aside>
  <main id="main">
    <div id="view-graph" class="view"><svg id="svg"></svg></div>
    <div id="view-timeline" class="view hidden"></div>
    <div id="view-entities" class="view hidden"></div>
    <div id="view-entity" class="view hidden"></div>
  </main>
  <aside id="detail"><div id="detail-content">
    <div class="d-empty">点击左侧视图中的节点、边或事件卡片<br>此处显示详情与语料证据</div>
  </div></aside>
</div>
<footer id="foot"></footer>
<script>const GRAPH = __GRAPH_DATA__;</script>
<script>
"use strict";
/* ---------- 基础数据 ---------- */
const TYPE_META = {
  Person:        {label:"人物",     color:"#c2410c"},
  Deity:         {label:"神灵",     color:"#7c3aed"},
  RoleFigure:    {label:"角色/动物", color:"#ca8a04"},
  Place:         {label:"地点",     color:"#15803d"},
  Object:        {label:"器物",     color:"#92400e"},
  Piece:         {label:"歌篇/版本", color:"#1d4ed8"},
  Bearer:        {label:"传承者",   color:"#475569"},
  Region:        {label:"流传地",   color:"#0f766e"},
  Ritual:        {label:"仪式",     color:"#be185d"},
  ExternalPiece: {label:"外部版本件", color:"#9ca3af"},
  ExternalFigure:{label:"外部版本人物", color:"#9ca3af"},
  ExternalDoc:   {label:"外部文献",   color:"#9ca3af"},
};
const TYPE_ORDER = ["Person","Deity","RoleFigure","Place","Object","Piece","Bearer","Region","Ritual","ExternalPiece","ExternalFigure","ExternalDoc"];
const LAYER_META = {
  fact:      {label:"事实层",   color:"#52525b", dash:null},
  version:   {label:"版本链",   color:"#2563eb", dash:"7 4"},
  cross_doc: {label:"跨册/平行", color:"#9333ea", dash:"2 4"},
};
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nodeById = new Map(GRAPH.nodes.map(n=>[n.id,n]));
GRAPH.nodes.forEach(n=>n.deg=0);
GRAPH.edges.forEach(e=>{const s=nodeById.get(e.source),t=nodeById.get(e.target); if(s)s.deg++; if(t)t.deg++;});
const attrByEntity = new Map();
GRAPH.attributes.forEach(a=>{
  if(!attrByEntity.has(a.entity_id)) attrByEntity.set(a.entity_id,[]);
  attrByEntity.get(a.entity_id).push(a);
});
const eventsByEntity = new Map();
GRAPH.events.forEach(v=>{
  const push=(k,role)=>[].concat(v[k]||[]).forEach(id=>{
    if(!eventsByEntity.has(id)) eventsByEntity.set(id,[]);
    eventsByEntity.get(id).push({event:v, role});
  });
  push("agents","agent"); push("patients","patient"); push("located","located");
});
const typeVisible={}, layerVisible={fact:true,version:true,cross_doc:true};
Object.keys(TYPE_META).forEach(t=>typeVisible[t]=true);
let edgeLabelsOn = true;
let selected = null;            // {kind:'node'|'edge', id}
let searchActive = false;

/* ---------- 统计与图例 ---------- */
document.getElementById("stats").innerHTML =
  `<span>节点 ${GRAPH.meta.counts.nodes}</span><span>边 ${GRAPH.meta.counts.edges}</span>`+
  `<span>事件 ${GRAPH.meta.counts.events}</span><span>属性 ${GRAPH.meta.counts.attributes}</span>`;
document.getElementById("foot").textContent = GRAPH.meta.footer;

function legendRow(key, meta, count, on, isLine){
  return `<div class="lg-row ${on?"":"off"}" data-kind="${isLine?"layer":"type"}" data-key="${key}">
    ${isLine?`<span class="lg-line" style="border-color:${meta.color}"></span>`:`<span class="lg-dot" style="background:${meta.color}"></span>`}
    ${meta.label}<span class="lg-count">${count}</span></div>`;
}
function renderLegend(){
  const tc={}; GRAPH.nodes.forEach(n=>{tc[n.type]=(tc[n.type]||0)+1;});
  document.getElementById("type-legend").innerHTML = TYPE_ORDER.filter(t=>tc[t]).map(t=>legendRow(t,TYPE_META[t],tc[t],typeVisible[t],false)).join("");
  const lc={}; GRAPH.edges.forEach(e=>{lc[e.layer]=(lc[e.layer]||0)+1;});
  document.getElementById("layer-legend").innerHTML = Object.keys(LAYER_META).filter(l=>lc[l]).map(l=>legendRow(l,LAYER_META[l],lc[l],layerVisible[l],true)).join("");
}
renderLegend();

/* ---------- 图谱视图 ---------- */
const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";
let W=800, H=600, k=1, tx=0, ty=0;
const defs = svg.appendChild(document.createElementNS(NS,"defs"));
Object.entries(LAYER_META).forEach(([lay,m])=>{
  const mk=document.createElementNS(NS,"marker");
  mk.setAttribute("id","arr-"+lay); mk.setAttribute("viewBox","0 0 10 10");
  mk.setAttribute("refX","9"); mk.setAttribute("refY","5"); mk.setAttribute("markerWidth","7"); mk.setAttribute("markerHeight","7");
  mk.setAttribute("orient","auto-start-reverse");
  const p=document.createElementNS(NS,"path"); p.setAttribute("d","M0 0 L10 5 L0 10 z"); p.setAttribute("fill",m.color);
  mk.appendChild(p); defs.appendChild(mk);
});
const viewport = document.createElementNS(NS,"g"); svg.appendChild(viewport);
const edgeG = document.createElementNS(NS,"g"); viewport.appendChild(edgeG);
const lblG = document.createElementNS(NS,"g"); viewport.appendChild(lblG);
const nodeG = document.createElementNS(NS,"g"); viewport.appendChild(nodeG);

function nodeR(n){ return n.type==="Person" ? Math.max(13, 7+n.deg*1.1) : Math.min(15, 6+n.deg*1.4); }
GRAPH.nodes.forEach((n,i)=>{
  const a=i*2.39996, r=30+30*Math.sqrt(i);
  n.x=W/2+r*Math.cos(a); n.y=H/2+r*Math.sin(a); n.vx=0; n.vy=0;
});
const edgeEls=[], edgeLabelEls=[], nodeEls=new Map();
const pairCount={};
GRAPH.edges.forEach(e=>{const key=e.source+"→"+e.target; pairCount[key]=(pairCount[key]||0)+1;});
const pairSeen={};

GRAPH.edges.forEach(e=>{
  const m=LAYER_META[e.layer];
  const g=document.createElementNS(NS,"g"); g.setAttribute("class","edge");
  const line=document.createElementNS(NS,"path");
  line.setAttribute("fill","none"); line.setAttribute("stroke",m.color); line.setAttribute("stroke-width","1.6");
  if(m.dash) line.setAttribute("stroke-dasharray",m.dash);
  if(!e.symmetric) line.setAttribute("marker-end",`url(#arr-${e.layer})`);
  const hit=document.createElementNS(NS,"path");
  hit.setAttribute("class","edge-hit"); hit.setAttribute("fill","none");
  hit.addEventListener("click",ev=>{ev.stopPropagation(); selectEdge(e.id);});
  const lbl=document.createElementNS(NS,"text");
  lbl.setAttribute("class","edge-label"); lbl.textContent=e.relation;
  lbl.addEventListener("click",ev=>{ev.stopPropagation(); selectEdge(e.id);});
  g.appendChild(line); g.appendChild(hit);
  const idx=(pairSeen[e.source+"→"+e.target]=(pairSeen[e.source+"→"+e.target]||0));
  e._curve = pairCount[e.source+"→"+e.target]>1 ? (idx%2===0?1:-1)*(Math.floor(idx/2)+1)*22 : 0;
  pairSeen[e.source+"→"+e.target]++;
  edgeG.appendChild(g); edgeEls.push({e,g,line,hit});
  lblG.appendChild(lbl); edgeLabelEls.push({e,lbl});
});

GRAPH.nodes.forEach(n=>{
  const g=document.createElementNS(NS,"g"); g.setAttribute("class","node"+(n.source==="external_placeholder"?" ext":""));
  const c=document.createElementNS(NS,"circle");
  c.setAttribute("r",nodeR(n)); c.setAttribute("fill",TYPE_META[n.type]?TYPE_META[n.type].color:"#9ca3af");
  c.setAttribute("stroke","#fffdf8"); c.setAttribute("stroke-width","1.5");
  const t=document.createElementNS(NS,"text"); t.setAttribute("dy", nodeR(n)+13); t.textContent=n.name;
  g.appendChild(c); g.appendChild(t);
  if(n.type==="Person"){
    const tip=document.createElementNS(NS,"title"); tip.textContent="点击进入实体页"; g.appendChild(tip);
  }
  g.addEventListener("pointerdown",ev=>startNodeDrag(ev,n));
  g.addEventListener("click",ev=>{ev.stopPropagation(); selectNode(n.id);});
  nodeG.appendChild(g); nodeEls.set(n.id,{g,c,t});
});

function applyTransform(){ viewport.setAttribute("transform",`translate(${tx},${ty}) scale(${k})`); }
function svgPoint(ev){ const r=svg.getBoundingClientRect(); return {x:ev.clientX-r.left, y:ev.clientY-r.top}; }
function worldPoint(ev){ const p=svgPoint(ev); return {x:(p.x-tx)/k, y:(p.y-ty)/k}; }

svg.addEventListener("wheel",ev=>{
  ev.preventDefault();
  const f=ev.deltaY<0?1.12:1/1.12, p=svgPoint(ev);
  tx=p.x-(p.x-tx)*f; ty=p.y-(p.y-ty)*f; k*=f; applyTransform();
},{passive:false});
let pan=null;
svg.addEventListener("pointerdown",ev=>{
  if(ev.target===svg||ev.target===viewport||ev.target===edgeG||ev.target===nodeG){
    pan={sx:ev.clientX, sy:ev.clientY, tx0:tx, ty0:ty}; svg.classList.add("panning"); svg.setPointerCapture(ev.pointerId);
  }
});
svg.addEventListener("pointermove",ev=>{
  if(pan){ tx=pan.tx0+ev.clientX-pan.sx; ty=pan.ty0+ev.clientY-pan.sy; applyTransform(); }
});
svg.addEventListener("pointerup",()=>{ if(pan){pan=null; svg.classList.remove("panning");} });
svg.addEventListener("click",ev=>{
  if(ev.target===svg||ev.target===viewport||ev.target===edgeG||ev.target===nodeG) clearSelection();
});

let dragNode=null;
function startNodeDrag(ev,n){
  ev.stopPropagation();
  dragNode={n, sx:ev.clientX, sy:ev.clientY, moved:false, px:n.x, py:n.y};
  svg.setPointerCapture(ev.pointerId);
  const move=me=>{
    if(!dragNode) return;
    const dx=me.clientX-dragNode.sx, dy=me.clientY-dragNode.sy;
    if(Math.hypot(dx,dy)>4) dragNode.moved=true;
    const w=worldPoint(me);
    n.x=w.x; n.y=w.y; n.vx=0; n.vy=0;
    alpha=Math.max(alpha,0.35);
  };
  const up=me=>{
    window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up);
    const wasClick=!dragNode.moved; dragNode=null;
    if(wasClick) selectNode(n.id);
  };
  window.addEventListener("pointermove",move); window.addEventListener("pointerup",up);
}

/* 力导引布局：能量衰减但不冷透，保持常显微动 */
let alpha=1;
function tick(){
  alpha=Math.max(alpha*0.995,0.018);
  const A=alpha;
  const ns=GRAPH.nodes.filter(n=>!n.hidden);
  for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
    const a=ns[i],b=ns[j];
    let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy; if(d2<1)d2=1;
    const d=Math.sqrt(d2), f=2400/d2*A, fx=dx/d*f, fy=dy/d*f;
    a.vx-=fx; a.vy-=fy; b.vx+=fx; b.vy+=fy;
  }
  GRAPH.edges.forEach(e=>{
    if(e.hidden) return;
    const a=nodeById.get(e.source), b=nodeById.get(e.target);
    if(!a||!b||a.hidden||b.hidden) return;
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
    const rest=(a.source==="external_placeholder"||b.source==="external_placeholder")?128:92;
    const f=(d-rest)*0.012*A, fx=dx/d*f, fy=dy/d*f;
    a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
  });
  ns.forEach(n=>{
    n.vx+=(W/2-n.x)*0.0022*A; n.vy+=(H/2-n.y)*0.0022*A;
    n.vx*=0.86; n.vy*=0.86; n.x+=n.vx; n.y+=n.vy;
  });
  renderGraph();
  requestAnimationFrame(tick);
}
function renderGraph(){
  edgeEls.forEach(({e,line,hit})=>{
    const s=nodeById.get(e.source), t=nodeById.get(e.target);
    if(!s||!t) return;
    const dx=t.x-s.x, dy=t.y-s.y, d=Math.hypot(dx,dy)||1;
    let x1=s.x+dx/d*(nodeR(s)+3), y1=s.y+dy/d*(nodeR(s)+3);
    let x2=t.x-dx/d*(nodeR(t)+(e.symmetric?3:8)), y2=t.y-dy/d*(nodeR(t)+(e.symmetric?3:8));
    let dPath=`M${x1} ${y1} L${x2} ${y2}`;
    let mx=(x1+x2)/2, my=(y1+y2)/2;
    if(e._curve){
      const nx=-dy/d, ny=dx/d, off=e._curve;
      const cx1=x1+nx*off, cy1=y1+ny*off, cx2=x2+nx*off, cy2=y2+ny*off;
      dPath=`M${x1} ${y1} Q${(cx1+cx2)/2} ${(cy1+cy2)/2} ${x2} ${y2}`;
      mx=(x1+2*(cx1+cx2)/2+x2)/4; my=(y1+2*(cy1+cy2)/2+y2)/4;
    }
    line.setAttribute("d",dPath); hit.setAttribute("d",dPath);
    e._lsign = e._curve ? Math.sign(e._curve) : (edgeEls.length % 2 === 0 ? 1 : -1);
    e._nx=-dy/d; e._ny=dx/d;
    e._mx=mx; e._my=my;
  });
  edgeLabelEls.forEach(({e,lbl})=>{
    if(!edgeLabelsOn || e.hidden){ lbl.style.display="none"; return; }
    lbl.style.display="";
    lbl.setAttribute("x",e._mx + e._nx*9*e._lsign);
    lbl.setAttribute("y",e._my + e._ny*9*e._lsign - 4);
  });
  GRAPH.nodes.forEach(n=>{
    const el=nodeEls.get(n.id); if(!el) return;
    el.g.setAttribute("transform",`translate(${n.x},${n.y})`);
  });
}

function visibleEdges(){ return GRAPH.edges.filter(e=>layerVisible[e.layer] && typeVisible[nodeById.get(e.source)?.type] && typeVisible[nodeById.get(e.target)?.type]); }
function refreshVisibility(){
  GRAPH.nodes.forEach(n=>{ n.hidden = !typeVisible[n.type]; });
  GRAPH.edges.forEach(e=>{
    const s=nodeById.get(e.source), t=nodeById.get(e.target);
    e.hidden = !layerVisible[e.layer] || !s || !t || s.hidden || t.hidden;
  });
  edgeEls.forEach(({e,g})=>g.style.display=e.hidden?"none":"");
  edgeLabelEls.forEach(({e,lbl})=>{ if(e.hidden) lbl.style.display="none"; });
  nodeEls.forEach((el,id)=>{ el.g.style.display=nodeById.get(id).hidden?"none":""; });

function applyHighlight(){
  let hiNode=null, hiEdge=null;
  if(selected&&selected.kind==="node") hiNode=selected.id;
  if(selected&&selected.kind==="edge") hiEdge=selected.id;
  const focusId = hiNode || (hiEdge? null : null);
  let neighborIds=null, incidentEdges=null;
  if(hiNode){
    neighborIds=new Set([hiNode]); incidentEdges=new Set();
    GRAPH.edges.forEach(e=>{
      if(e.hidden) return;
      if(e.source===hiNode){neighborIds.add(e.target); incidentEdges.add(e.id);}
      if(e.target===hiNode){neighborIds.add(e.source); incidentEdges.add(e.id);}
    });
  }
  if(hiEdge){ incidentEdges=new Set([hiEdge]); neighborIds=new Set(); const e=GRAPH.edges.find(x=>x.id===hiEdge); if(e){neighborIds.add(e.source); neighborIds.add(e.target);} }
  nodeEls.forEach((el,id)=>{
    const n=nodeById.get(id);
    let dim=false;
    if(searchActive){ dim=!n._match; }
    else if(neighborIds){ dim=!neighborIds.has(id); }
    el.g.classList.toggle("dimmed",dim);
    el.g.classList.toggle("selected", hiNode===id);
  });
  edgeEls.forEach(({e,g})=>{
    let dim=false;
    if(searchActive){ dim=!(nodeById.get(e.source)._match&&nodeById.get(e.target)._match); }
    else if(incidentEdges){ dim=!incidentEdges.has(e.id); }
    g.classList.toggle("dimmed",dim);
  });
  edgeLabelEls.forEach(({e,lbl})=>{
    let dim=false;
    if(searchActive){ dim=!(nodeById.get(e.source)._match&&nodeById.get(e.target)._match); }
    else if(incidentEdges){ dim=!incidentEdges.has(e.id); }
    lbl.classList.toggle("dimmed",dim);
  });
}

        <div class="beat-pages">${esc(v.pages)}　<span class="ev-count">证据 ${v.evidence?v.evidence.length:0} 条</span></div>
        ${chipHtmls?`<div class="chips">${chipHtmls}</div>`:""}`;
    const mySubs=subs.filter(s=>s.sub_of===v.event_id).sort((a,b)=>a.event_id.localeCompare(b.event_id));
    if(mySubs.length){
      inner+=`<div class="sub-beats">`+mySubs.map(s=>`
        <div class="sub-card" data-event="${s.event_id}">
          <div class="sub-title">${esc(s.name)}</div>
          <div class="sub-pair">灾：${esc(s.threat_desc||"")}<br>解：${esc(s.counter_desc||"")}</div>
        </div>`).join("")+`</div>`;
    }
    inner+=`</div>`;
    b.innerHTML=inner; wrap.appendChild(b);
  });
  const tl=document.getElementById("view-timeline");
  tl.innerHTML=""; tl.appendChild(wrap);
  tl.querySelectorAll(".beat-card, .sub-card").forEach(el=>{
    el.addEventListener("click",ev=>{
      const focusChip=ev.target.closest("[data-focus]");
      if(focusChip){ ev.stopPropagation(); focusNode(focusChip.dataset.focus); return; }
      ev.stopPropagation();
      selectEvent(el.dataset.event);
    });
  });
}
function markTimelineSelection(){
  document.querySelectorAll("#view-timeline .beat-card, #view-timeline .sub-card").forEach(el=>{
    el.classList.toggle("selected", !!selected && selected.kind==="event" && selected.id===el.dataset.event);
  });
}

/* ---------- 实体视图 ---------- */
function buildEntities(){
  const wrap=document.createElement("div"); wrap.className="ent-wrap";
  wrap.innerHTML=`<div class="d-note" style="margin-bottom:14px">S1 白名单 ${GRAPH.meta.counts.whitelist} 实体 + S2 版本层边引用的外部版本件 ${GRAPH.meta.counts.external} 项（demo 占位，正式登记在 S4 落库处理）。「未入边」= 暂无 S2 三元组/事件引用，仅登记待用。</div>`;
  TYPE_ORDER.forEach(t=>{
    const list=GRAPH.nodes.filter(n=>n.type===t);
    if(!list.length) return;
    const m=TYPE_META[t];
    const isExt=t.startsWith("External");
    const g=document.createElement("div"); g.className="ent-group";
    g.innerHTML=`<h3><span class="lg-dot" style="background:${m.color}"></span>${m.label}（${list.length}）</h3>`;
    const tbl=document.createElement("table");
    tbl.innerHTML=`<tr><th>名称</th><th>kind</th><th>别名</th><th>属性</th><th>度</th><th>首见</th></tr>`+
      list.map(n=>{
        const ext=n.source==="external_placeholder";
        const al=n.aliases?Object.keys(n.aliases).length:0;
        const at=(attrByEntity.get(n.id)||[]).length;
        return `<tr data-node="${n.id}"><td class="${(!n.in_graph&&!ext)?"dim-name":""}">${esc(n.name)}${
          ext?`<span class="tag ext">外部占位</span>`:(n.in_graph?`<span class="tag">在图谱</span>`:`<span class="tag off">未入边</span>`)
        }</td><td>${esc(n.kind||"—")}</td><td>${al||"—"}</td><td>${at||"—"}</td><td>${n.deg||0}</td><td>${
          n.first_seen?(n.first_seen.page?`p${n.first_seen.page}`:"外部"):(ext?"—":"")}</td></tr>`;
      }).join("");
    g.appendChild(tbl); wrap.appendChild(g);
  });
  const ev=document.getElementById("view-entities");
  ev.innerHTML=""; ev.appendChild(wrap);
  ev.querySelectorAll("tr[data-node]").forEach(tr=>tr.addEventListener("click",()=>selectNode(tr.dataset.node,true)));
}

/* ---------- 视图切换 / 筛选 / 搜索 ---------- */
let currentView="graph";
function switchView(v){
  currentView=v;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
  document.getElementById("view-graph").classList.toggle("hidden",v!=="graph");
  document.getElementById("view-timeline").classList.toggle("hidden",v!=="timeline");
  document.getElementById("view-entities").classList.toggle("hidden",v!=="entities");
  const isEp = v==="entity";
  document.getElementById("view-entity").classList.toggle("hidden",!isEp);
  document.getElementById("app").classList.toggle("entity-open",isEp);
  if(lastEntityId) document.getElementById("tab-entity").style.display="";
  if(isEp&&lastEntityId) buildEntityPage(lastEntityId);
  if(v==="timeline"&&!buildTimeline._done){buildTimeline(); buildTimeline._done=true;}
  if(v==="entities"&&!buildEntities._done){buildEntities(); buildEntities._done=true;}
  markTimelineSelection();
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>switchView(b.dataset.view)));

document.getElementById("legend").addEventListener("click",ev=>{
  const row=ev.target.closest(".lg-row"); if(!row) return;
  if(row.dataset.kind==="type") typeVisible[row.dataset.key]=!typeVisible[row.dataset.key];
  else layerVisible[row.dataset.key]=!layerVisible[row.dataset.key];
  refreshVisibility(); wake();
});
document.getElementById("toggle-edge-labels").addEventListener("click",()=>{
  edgeLabelsOn=!edgeLabelsOn;
  document.getElementById("edge-label-state").textContent=edgeLabelsOn?"开":"关";
  renderGraph();
});
document.getElementById("btn-reset").addEventListener("click",resetAll);
function resetAll(){
  Object.keys(typeVisible).forEach(t=>typeVisible[t]=true);
  Object.keys(layerVisible).forEach(l=>layerVisible[l]=true);
  edgeLabelsOn=true; document.getElementById("edge-label-state").textContent="开";
  searchInput.value=""; searchActive=false;
  GRAPH.nodes.forEach(n=>delete n._match);
  refreshVisibility(); wake(); clearSelection();
  k=1; tx=0; ty=0; applyTransform();
  switchView("graph");
}
const searchInput=document.getElementById("search");
searchInput.addEventListener("input",()=>{
  const q=searchInput.value.trim();
  GRAPH.nodes.forEach(n=>delete n._match);
  searchActive=!!q;
  if(q){
    GRAPH.nodes.forEach(n=>{
      let hit=n.name.includes(q) || (n.aliases&&Object.keys(n.aliases).some(a=>a.includes(q))) || (n.ref_forms&&n.ref_forms.some(f=>f.form.includes(q)));
      if(hit) n._match=true;
    });
  }
  applyHighlight();
});
searchInput.addEventListener("keydown",ev=>{
  if(ev.key==="Enter"){
    const first=GRAPH.nodes.find(n=>n._match);
    if(first) focusNode(first.id);
  }
});
function wake(){ alpha=Math.max(alpha,0.55); }

/* ---------- 启动 ---------- */
function resize(){
  const main=document.getElementById("main");
  W=main.clientWidth; H=main.clientHeight;
  svg.setAttribute("width",W); svg.setAttribute("height",H);
  renderGraph();
}
window.addEventListener("resize",resize);
resize();
refreshVisibility();
requestAnimationFrame(tick);
</script>
</body>
</html>
